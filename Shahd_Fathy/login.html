<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wanderlust</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Login</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem;">
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 0.5rem;">
            </div>
            <button type="submit" class="btn" style="width: 100%; padding: 0.75rem;">Login</button>
            <p id="responseMsg" style="margin-top: 1rem; text-align: center;"></p>
        </form>
        <p style="text-align: center; margin-top: 1rem;">Don't have an account? <a href="register.html">Register</a></p>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('responseMsg');

            try {
                const response = await fetch('http://127.0.0.1:5001/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    msg.style.color = 'green';
                    msg.textContent = 'Logged in successfully! Redirecting to dashboard...';

                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    msg.style.color = 'red';
                    msg.textContent = data.error || 'Invalid credentials.';
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = 'Server connection error.';
            }
        }
    </script>
</body>

</html>
