<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust - Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2,
        h3 {
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            background-color: #007bff;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div style="margin-bottom:1rem;">
            <a href="admin.html">Destinations</a> |
            <a href="admin_services.html">Services</a> |
            <a href="admin_requests.html">Requests</a>
        </div>

        <h2>Content Management Admin Panel</h2>
        <p>Manage website destinations dynamically (Task 3)</p>

        <!-- Form for Add / Update -->
        <div style="background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
            <h3 id="formTitle">Add New Destination</h3>
            <form id="destForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="destId">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="description" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Image Path (e.g., images/paris.jpg):</label>
                    <input type="text" id="imageUrl" required>
                </div>
                <button type="submit" id="submitBtn">Save Destination</button>
                <button type="button" id="cancelBtn" onclick="resetForm()"
                    style="background: #6c757d; display:none;">Cancel</button>
            </form>
        </div>

        <!-- Table displaying items -->
        <h3>Existing Destinations</h3>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Image</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="destTableBody">

            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5001/api/destinations';

        async function checkAccess() {
            try {
                const response = await fetch('http://127.0.0.1:5001/api/check-auth');
                const data = await response.json();
                if (!data.authenticated) {
                    // لو مش مسجل دخول، حوله فوراً لصفحة الـ Login
                    window.location.href = 'login.html';
                }
            } catch (error) {
                window.location.href = 'login.html';
            }
        }
        checkAccess();

        // 1. READ: Load all destinations
        async function loadDestinations() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const tbody = document.getElementById('destTableBody');
                tbody.innerHTML = '';

                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${item.title}</strong></td>
                            <td>${item.description}</td>
                            <td><code>${item.image_url}</code></td>
                            <td>
                                <button class="btn-warning" onclick="editItem(${item.id}, '${item.title}', '${item.description}', '${item.image_url}')">Edit</button>
                                <button class="btn-danger" onclick="deleteItem(${item.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('destId').value;
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const image_url = document.getElementById('imageUrl').value;

            const isUpdate = id !== '';
            const url = isUpdate ? `${API_URL}/${id}` : API_URL;
            const method = isUpdate ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, image_url })
                });

                if (res.ok) {
                    resetForm();
                    loadDestinations();
                }
            } catch (err) {
                console.error('Error saving data:', err);
            }
        }
        function editItem(id, title, description, imageUrl) {
            document.getElementById('destId').value = id;
            document.getElementById('title').value = title;
            document.getElementById('description').value = description;
            document.getElementById('imageUrl').value = imageUrl;

            document.getElementById('formTitle').innerText = 'Edit Destination';
            document.getElementById('submitBtn').innerText = 'Update';
            document.getElementById('cancelBtn').style.display = 'inline-block';
        }

        // 3. DELETE: Remove destination
        async function deleteItem(id) {
            if (confirm('Are you sure you want to delete this destination?')) {
                try {
                    const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadDestinations();
                    }
                } catch (err) {
                    console.error('Error deleting item:', err);
                }
            }
        }

        function resetForm() {
            document.getElementById('destForm').reset();
            document.getElementById('destId').value = '';
            document.getElementById('formTitle').innerText = 'Add New Destination';
            document.getElementById('submitBtn').innerText = 'Save Destination';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        loadDestinations();
    </script>
</body>

</html>
