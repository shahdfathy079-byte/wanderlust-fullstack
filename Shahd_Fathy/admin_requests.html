<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Requests - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="padding:2rem; background:#f8fafc;">
    <div
        style="max-width:1100px; margin:0 auto; background:white; padding:2rem; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.05);">
        <div style="margin-bottom:1rem;">
            <a href="admin.html">Destinations</a> |
            <a href="admin_services.html">Services</a> |
            <a href="admin_requests.html">Requests</a>
        </div>

        <h2 style="margin-bottom:1.5rem; color:#1e293b;">
            <i class="fas fa-tasks"></i> Customer Requests Management
        </h2>

        <div style="margin-bottom:1rem;">
            <label>Filter by status: </label>
            <select id="filterStatus" onchange="loadRequests()" style="padding:0.4rem;">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>

        <table style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:#3b82f6; color:white;">
                    <th style="padding:10px; text-align:left;">ID</th>
                    <th style="padding:10px; text-align:left;">Customer</th>
                    <th style="padding:10px; text-align:left;">Service</th>
                    <th style="padding:10px; text-align:left;">Details</th>
                    <th style="padding:10px; text-align:left;">Status</th>
                    <th style="padding:10px; text-align:left;">Actions</th>
                </tr>
            </thead>
            <tbody id="reqTableBody"></tbody>
        </table>
    </div>

    <script>
        const API = 'http://127.0.0.1:5001';

        async function checkAccess() {
            try {
                const res = await fetch(`${API}/api/check-auth`, { credentials: 'include' });
                const data = await res.json();
                if (!data.authenticated) window.location.href = 'login.html';
            } catch { window.location.href = 'login.html'; }
        }
        checkAccess();

        async function loadRequests() {
            try {
                const res = await fetch(`${API}/api/admin/requests`, { credentials: 'include' });
                if (!res.ok) { window.location.href = 'login.html'; return; }
                let data = await res.json();

                const filter = document.getElementById('filterStatus').value;
                if (filter) data = data.filter(r => r.status === filter);

                const tbody = document.getElementById('reqTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="padding:1rem; text-align:center; color:#64748b;">No requests.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(r => `
                    <tr style="border-bottom:1px solid #e2e8f0;">
                        <td style="padding:10px;">#${r.id}</td>
                        <td style="padding:10px;">
                            <strong>${r.customer_name}</strong><br>
                            <small style="color:#64748b;">${r.customer_email}</small>
                        </td>
                        <td style="padding:10px;">${r.service_type}</td>
                        <td style="padding:10px; max-width:250px;">${r.details}</td>
                        <td style="padding:10px;">
                            <span style="padding:0.3rem 0.7rem; border-radius:20px; color:white; font-size:0.85rem; background:${statusColor(r.status)};">
                                ${r.status}
                            </span>
                        </td>
                        <td style="padding:10px;">
                            <select onchange="updateStatus(${r.id}, this.value)" style="padding:0.3rem;">
                                ${['pending', 'in_progress', 'completed', 'rejected'].map(s =>
                    `<option value="${s}" ${s === r.status ? 'selected' : ''}>${s}</option>`
                ).join('')}
                            </select>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        function statusColor(status) {
            return {
                'pending': '#f59e0b',
                'in_progress': '#3b82f6',
                'completed': '#10b981',
                'rejected': '#ef4444'
            }[status] || '#64748b';
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`${API}/api/admin/requests/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    loadRequests();
                } else {
                    alert('Failed to update status.');
                }
            } catch (err) { alert('Server error.'); }
        }

        loadRequests();
    </script>
</body>

</html>
