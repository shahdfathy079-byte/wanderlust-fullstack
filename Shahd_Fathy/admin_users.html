<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Users - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="padding:2rem; background:#f8fafc;">
    <div
        style="max-width:1000px; margin:0 auto; background:white; padding:2rem; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.05);">

        <div
            style="margin-bottom:1.5rem; display:flex; gap:1rem; border-bottom:1px solid #e2e8f0; padding-bottom:1rem;">
            <a href="admin.html"
                style="text-decoration:none; color:#3b82f6; font-weight:600; padding:0.4rem 0.8rem; border-radius:6px; background:#eff6ff;">Destinations</a>
            <a href="admin_services.html"
                style="text-decoration:none; color:#3b82f6; font-weight:600; padding:0.4rem 0.8rem; border-radius:6px; background:#eff6ff;">Services</a>
            <a href="admin_requests.html"
                style="text-decoration:none; color:#3b82f6; font-weight:600; padding:0.4rem 0.8rem; border-radius:6px; background:#eff6ff;">Requests</a>
            <a href="admin_users.html"
                style="text-decoration:none; color:#3b82f6; font-weight:600; padding:0.4rem 0.8rem; border-radius:6px; background:#dbeafe;">Users</a>
        </div>

        <h2 style="margin-bottom:1.5rem; color:#1e293b;">
            <i class="fas fa-users-cog"></i> User Management
        </h2>

        <table style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:#3b82f6; color:white;">
                    <th style="padding:10px; text-align:left;">ID</th>
                    <th style="padding:10px; text-align:left;">Username</th>
                    <th style="padding:10px; text-align:left;">Email</th>
                    <th style="padding:10px; text-align:left;">Role</th>
                    <th style="padding:10px; text-align:left;">Change Role</th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>

    <script>
        const API = 'http://127.0.0.1:5001';

        async function checkAdmin() {
            try {
                const res = await fetch(`${API}/api/check-auth`, { credentials: 'include' });
                const data = await res.json();
                if (!data.authenticated) {
                    window.location.href = 'login.html';
                    return;
                }
                if (data.role !== 'admin') {
                    alert('Access denied. Admins only.');
                    window.location.href = 'dashboard.html';
                }
            } catch {
                window.location.href = 'login.html';
            }
        }
        checkAdmin();

        async function loadUsers() {
            try {
                const res = await fetch(`${API}/api/admin/users`, { credentials: 'include' });
                if (res.status === 403) {
                    alert('Access denied.');
                    window.location.href = 'dashboard.html';
                    return;
                }
                const users = await res.json();
                const tbody = document.getElementById('usersTableBody');

                tbody.innerHTML = users.map(u => `
                    <tr style="border-bottom:1px solid #e2e8f0;">
                        <td style="padding:10px;">#${u.id}</td>
                        <td style="padding:10px;"><strong>${u.username}</strong></td>
                        <td style="padding:10px;">${u.email}</td>
                        <td style="padding:10px;">
                            <span style="padding:0.3rem 0.7rem; border-radius:20px; color:white; font-size:0.85rem; background:${roleColor(u.role)};">
                                ${u.role}
                            </span>
                        </td>
                        <td style="padding:10px;">
                            <select onchange="updateRole(${u.id}, this.value)" style="padding:0.3rem;">
                                ${['admin', 'employee', 'customer'].map(r =>
                    `<option value="${r}" ${r === u.role ? 'selected' : ''}>${r}</option>`
                ).join('')}
                            </select>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        function roleColor(role) {
            return { 'admin': '#ef4444', 'employee': '#f59e0b', 'customer': '#10b981' }[role] || '#64748b';
        }

        async function updateRole(id, role) {
            try {
                const res = await fetch(`${API}/api/admin/users/${id}/role`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ role })
                });
                const data = await res.json();
                if (res.ok) {
                    loadUsers();
                } else {
                    alert(data.error || 'Failed to update role.');
                    loadUsers();
                }
            } catch (err) { alert('Server error.'); }
        }

        loadUsers();
    </script>
</body>

</html>
