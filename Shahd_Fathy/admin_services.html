<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="padding: 2rem; background: #f8fafc;">
    <div
        style="max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <div style="margin-bottom:1rem;">
            <a href="admin.html">Destinations</a> |
            <a href="admin_services.html">Services</a> |
            <a href="admin_requests.html">Requests</a>
        </div>

        <h2 style="margin-bottom: 1.5rem; color: #1e293b;"><i class="fas fa-cogs"></i> Manage Company Services</h2>

        <form id="addServiceForm" onsubmit="addService(event)"
            style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <input type="text" id="title" placeholder="Service Title" required
                style="padding: 0.5rem; flex: 1; min-width: 200px;">
            <input type="text" id="description" placeholder="Description" required
                style="padding: 0.5rem; flex: 2; min-width: 250px;">
            <input type="text" id="icon" placeholder="Icon (e.g. fas fa-plane)" value="fas fa-plane"
                style="padding: 0.5rem; width: 150px;">
            <button type="submit" class="btn"
                style="padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Add
                Service</button>
        </form>

        <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #e2e8f0;">

        <h3>Existing Services</h3>
        <div id="servicesList" style="margin-top: 1rem;">
            <p>Loading...</p>
        </div>
    </div>

    <script>
        async function fetchServices() {
            try {
                const response = await fetch('http://127.0.0.1:5001/api/services');
                const services = await response.json();
                const list = document.getElementById('servicesList');
                list.innerHTML = '';

                services.forEach(service => {
                    list.innerHTML += `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #e2e8f0;">
                            <div>
                                <strong><i class="${service.icon}"></i> ${service.title}</strong>
                                <p style="color: #64748b; font-size: 0.9rem; margin: 0.2rem 0 0 0;">${service.description}</p>
                            </div>
                            <button onclick="deleteService(${service.id})" style="background: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;">Delete</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Error fetching services:', err);
            }
        }

        async function addService(event) {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const icon = document.getElementById('icon').value;

            const response = await fetch('http://127.0.0.1:5001/api/services', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, icon })
            });

            if (response.ok) {
                document.getElementById('addServiceForm').reset();
                fetchServices();
            } else {
                alert('Failed to add service.');
            }
        }

        async function deleteService(id) {
            if (confirm('Are you sure you want to delete this service?')) {
                const response = await fetch(`http://127.0.0.1:5001/api/services/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchServices();
                } else {
                    alert('Failed to delete service.');
                }
            }
        }

        fetchServices();
    </script>
</body>

</html>
